name: Account access rules
on:
  pull_request:
  push:
    branches: [main]
jobs:
  access-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test tests/a1-phrases.test.cjs tests/audit-fixes.test.cjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
